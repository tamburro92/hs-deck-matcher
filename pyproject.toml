[project]
name = "hsmatcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["playwright", "hearthstone", "httpx"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsmatcher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
