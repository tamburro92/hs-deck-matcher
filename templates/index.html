<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS Deck Matcher</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--mut:#667085;--card:#fff;--bd:#e2e5ea;--ac:#2f6feb;--ok:#13804a;--ko:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e8ebf0;--mut:#98a2b3;--card:#1c2029;--bd:#2c323d;--ac:#6ea0ff;--ok:#4cc38a;--ko:#ff7b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:16px;margin:0}.mut{color:var(--mut)}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
main{padding:12px 16px;max-width:1200px;margin:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.msg{padding:8px 12px;border-radius:6px;background:var(--card);border:1px solid var(--bd);margin:8px 0}.err{color:var(--ko)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:8px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--bd)}th{cursor:pointer;white-space:nowrap;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.d{cursor:pointer}tr.d:hover{background:var(--bg)}
.ok{color:var(--ok)}.ko{color:var(--ko)}.det td{background:var(--bg)}
.cards{columns:3 220px;font-size:13px}.cards div{break-inside:avoid}
@media (max-width:640px){.hide-s{display:none}}
</style>
</head>
<body>
<header>
  <h1>HS Deck Matcher</h1>
  <button id="conn"></button>
  <span id="info" class="mut"></span>
</header>
<main>
  <div class="bar" id="tabs"><button data-src="hs" class="on">HSReplay</button><button data-src="guru">HSGuru</button></div>
  <div id="msg"></div>
  <div id="ui" hidden>
    <div class="bar">
      <select id="win"><option value="patch">Patch corrente</option><option value="7">Ultimi 7 giorni</option><option value="1">Ultimo giorno</option></select>
      <select id="cls"><option value="">Tutte le classi</option></select>
      <input id="q" placeholder="Cerca deck o carta…" size="22">
      <input id="inc" placeholder="Contiene carta" size="14">
      <input id="exc" placeholder="Senza carta" size="14">
      <label>Partite ≥ <input id="mg" type="number" value="500" min="0" step="100" style="width:80px"></label>
      <label>Win% ≥ <input id="mw" type="number" value="0" min="0" max="100" step="1" style="width:60px"></label>
    </div>
    <div class="bar">
      <span class="mut">Polvere max:</span><span id="bands"></span>
      <label><input id="auto" type="checkbox" checked> allarga se vuoto</label>
      <label><input id="aff" type="checkbox"> solo ciò che posso permettermi</label>
    </div>
    <div id="note" class="mut"></div>
    <table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const BANDS = [0, 400, 800, 1600, 3200, 6400, Infinity];
const COLS = [["name","Deck"],["cls","Classe"],["wr","Win%","n"],["lb","Wilson","n hide-s"],["games","Partite","n"],["trend","Trend","n hide-s"],["dust","Polvere","n"],["miss","Mancanti","n hide-s"]];
let src = "hs", F = {}, D = null, band = 0, sortKey = "wr", sortDir = -1, open = new Set(), busy = false;

const decks = () => src === "hs" ? D.decks : (D.guru ? D.guru.decks : []);
const FIELDS = ["win", "cls", "q", "inc", "exc", "mg", "mw", "auto", "aff"];
const getF = () => Object.fromEntries(FIELDS.map(k => [k, $(k).type === "checkbox" ? $(k).checked : $(k).value]));
const setF = f => FIELDS.forEach(k => { if (f && k in f) { $(k).type === "checkbox" ? ($(k).checked = f[k]) : ($(k).value = f[k]); } });
const DEF = {hs: {win: "patch", cls: "", q: "", inc: "", exc: "", mg: 500, mw: 0, auto: true, aff: false},
             guru: {win: "patch", cls: "", q: "", inc: "", exc: "", mg: 0, mw: 0, auto: true, aff: false}};
const wilson = (wr, n) => { if (!n) return 0; const p = wr/100, z = 1.96, d = 1 + z*z/n;
  return 100 * ((p + z*z/(2*n) - z*Math.sqrt(p*(1-p)/n + z*z/(4*n*n))) / d); };
const fmt = (x, k=1) => x == null ? "—" : x.toFixed(k);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load() {
  D = await (await fetch("/api/data")).json();
  const has = D.decks && D.decks.length;
  $("ui").hidden = !has;
  if (!F.hs) { F.hs = {...DEF.hs}; F.guru = {...DEF.guru}; }
  $("win").style.display = src === "hs" ? "" : "none";
  $("conn").textContent = src === "guru" ? (D.guru ? "Aggiorna da HSGuru" : "Importa da HSGuru") : !has ? "Connetti HSReplay" : (D.collection ? "Aggiorna meta e collezione" : "Connetti HSReplay (collezione)");
  if (!has) { $("msg").innerHTML = '<div class="msg">Nessun dato ancora. Premi <b>Connetti HSReplay</b>: si apre Chrome, fai il login la prima volta.</div>'; return; }
  if (src === "guru") $("info").textContent = D.guru ? `HSGuru: ${D.guru.decks.length} deck, importati ${new Date(D.guru.at).toLocaleString("it-IT")} · filtri scelti sul sito: ${D.guru.url}` : "Nessun dato HSGuru: premi Importa da HSGuru";
  else $("info").textContent = `Aggiornato ${new Date(D.as_of).toLocaleString("it-IT")} · rank ${D.rank} · ` +
    (D.collection ? `polvere posseduta ${D.collection.dust}` : "collezione non collegata");
  const cs = [...new Set(D.decks.map(d => d.cls))].sort();
  if ($("cls").options.length === 1) cs.forEach(c => $("cls").add(new Option(c[0] + c.slice(1).toLowerCase(), c)));
  const wsel = $("win");
  const has7 = D.decks.some(d => d.w && d.w[7]), has1 = D.decks.some(d => d.w && d.w[1]);
  wsel.options[1].disabled = !has7; wsel.options[2].disabled = !has1;
  render();
}

function enrich() {
  const own = D.collection ? D.collection.cards : null, w = $("win").value;
  return decks().map(d => {
    let dust = 0, miss = 0, lines = [];
    for (const [id, n] of d.cards) {
      const [name, cost, free, mana] = D.cards[id];
      const have = free ? 2 : (own ? (own[id] || 0) : 0);
      const m = Math.max(0, n - have);
      dust += m * cost; miss += m;
      lines.push({name, n, m, cost, mana, free});
    }
    lines.sort((a, b) => a.mana - b.mana || a.name.localeCompare(b.name));
    let games = d.games, wr = d.wr;
    if (src === "hs" && w !== "patch") { const x = d.w && d.w[w]; if (!x) return null; games = x[0]; wr = x[1]; }
    const t = src === "hs" && d.w && d.w[1] ? d.w[1][1] - d.wr : null;
    return {...d, games, wr, lb: wilson(wr, games), trend: t, dust, miss, lines};
  }).filter(Boolean);
}

function render() {
  if (!D || !D.decks) return;
  let rows = enrich();
  const q = $("q").value.toLowerCase(), inc = $("inc").value.toLowerCase(), exc = $("exc").value.toLowerCase();
  const mg = +$("mg").value, mw = +$("mw").value, cls = $("cls").value;
  const has = (r, s) => r.lines.some(l => l.name.toLowerCase().includes(s));
  rows = rows.filter(r => r.games >= mg && r.wr >= mw && (!cls || r.cls === cls)
    && (!q || r.name.toLowerCase().includes(q) || has(r, q)) && (!inc || has(r, inc)) && (!exc || !has(r, exc)));
  if ($("aff").checked && D.collection) rows = rows.filter(r => r.dust <= D.collection.dust);
  let b = band, note = "";
  if (!D.collection) note = "Collezione non collegata: tutte le carte non gratuite risultano mancanti.";
  let sel = rows.filter(r => r.dust <= BANDS[b]);
  if (!sel.length && $("auto").checked) {
    let nb = b; while (!sel.length && nb < BANDS.length - 1) { nb++; sel = rows.filter(r => r.dust <= BANDS[nb]); }
    if (sel.length) note += ` Nessun deck ≤ ${BANDS[b]}: mostro fino a ${BANDS[nb] === Infinity ? "tutti" : BANDS[nb]}.`;
    else { sel = [...rows].sort((a, c) => a.dust - c.dust).slice(0, 10); note += " Nessun deck nelle fasce: mostro i 10 più economici."; }
  }
  $("note").textContent = note.trim();
  sel.sort((a, c) => {
    const x = a[sortKey], y = c[sortKey];
    return (typeof x === "string" ? x.localeCompare(y) : (x ?? -1e9) - (y ?? -1e9)) * sortDir;
  });
  $("head").innerHTML = COLS.map(([k, l, c]) => `<th class="${c || ""}" data-k="${k}">${l}${k === sortKey ? (sortDir < 0 ? " ▼" : " ▲") : ""}</th>`).join("");
  $("body").innerHTML = sel.slice(0, 300).map(r => {
    const t = r.trend == null ? "—" : (r.trend > 0 ? "+" : "") + r.trend.toFixed(1);
    let h = `<tr class="d" data-id="${r.id}"><td>${esc(r.name)}</td><td>${r.cls[0] + r.cls.slice(1).toLowerCase()}</td><td class="n">${fmt(r.wr)}</td>` +
      `<td class="n hide-s">${fmt(r.lb)}</td><td class="n">${r.games.toLocaleString("it-IT")}</td><td class="n hide-s">${t}</td>` +
      `<td class="n ${r.dust ? "" : "ok"}">${r.dust}</td><td class="n hide-s">${r.miss}</td></tr>`;
    if (open.has(r.id)) h += `<tr class="det"><td colspan="8"><button data-copy="${r.id}">Copia deck code</button>` +
      `<div class="cards">${r.lines.map(l => `<div class="${l.m ? "ko" : "ok"}">${l.m ? "✗" : "✓"} ${l.n}× ${esc(l.name)} <span class="mut">(${l.mana})${l.m ? " · " + l.m * l.cost : ""}</span></div>`).join("")}</div></td></tr>`;
    return h;
  }).join("") || `<tr><td colspan="8" class="mut">Nessun deck con questi filtri.</td></tr>`;
  $("bands").innerHTML = BANDS.map((v, i) => `<button data-b="${i}" class="${i === band ? "on" : ""}">${v === Infinity ? "tutti" : v === 0 ? "0" : "≤" + v}</button>`).join(" ");
}

let lastAsOf = null;
async function waitData() {
  const s = await (await fetch("/api/status")).json();
  if (s.error) { $("msg").innerHTML = `<div class="msg err">Errore: ${esc(s.error)}</div>`; return; }
  if (s.msg === "Dati ricevuti") { await fetch("/api/status"); $("msg").innerHTML = ""; $("conn").disabled = false; load(); return; }
  setTimeout(waitData, 1500);
}
$("conn").onclick = async () => {
  const code = await (await fetch(src === "guru" ? "/api/snippet_guru" : "/api/snippet")).text();
  let copied = true;
  try { await navigator.clipboard.writeText(code); } catch (e) { copied = false; }
  window.open(src === "guru" ? "https://www.hsguru.com/decks" : "https://hsreplay.net/decks/", "_blank");
  $("msg").innerHTML = `<div class="msg"><b>1.</b> Nella scheda appena aperta (su HSGuru imposta prima i filtri che vuoi: periodo, rank, partite minime) apri la console: <b>Cmd+Opt+J</b>.<br>` +
    `<b>2.</b> Incolla (Cmd+V) e premi Invio${copied ? "" : " — il codice non è stato copiato, <a href='/api/snippet' target='_blank'>aprilo qui</a> e copialo"}. ` +
    `Se Chrome lo chiede, scrivi <code>allow pasting</code> e Invio, poi incolla di nuovo.<br>` +
    `<b>3.</b> Torna qui: la pagina si aggiorna da sola.</div>`;
  fetch("/api/status"); waitData();
};
document.addEventListener("input", e => { if (e.target.closest("#ui")) render(); });
document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.src && t.dataset.src !== src) {
    F[src] = getF(); src = t.dataset.src; setF(F[src]);
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.src === src));
    $("msg").innerHTML = ""; open.clear(); load();
  }
  else if (t.dataset.b) { band = +t.dataset.b; render(); }
  else if (t.dataset.copy) { navigator.clipboard.writeText(decks().find(d => d.id === t.dataset.copy).code); t.textContent = "Copiato ✓"; }
  else if (t.closest("th[data-k]")) { const k = t.closest("th").dataset.k; sortDir = k === sortKey ? -sortDir : (k === "name" || k === "cls" ? 1 : -1); sortKey = k; render(); }
  else if (t.closest("tr.d")) { const id = t.closest("tr").dataset.id; open.has(id) ? open.delete(id) : open.add(id); render(); }
});
load();
</script>
</body>
</html>
